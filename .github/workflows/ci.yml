name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads every commit, not just the latest

      # The free gitleaks CLI, downloaded and checked against its release checksums: no account
      # or key. It scans every commit, because a secret removed later is still in the history.
      # What to do when it finds one: docs/03-build.md, "When you get stuck".
      - name: No secrets in the code or its history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$release/$tarball"
          curl -sSfLO "$release/$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$tarball" gitleaks
          cd "$GITHUB_WORKSPACE"
          status=0
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --report-format json --report-path "$RUNNER_TEMP/leaks.json" . || status=$?
          if [ "$status" -ne 0 ] && [ -s "$RUNNER_TEMP/leaks.json" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::possible secret (\(.RuleID)) in commit \(.Commit[0:7]), fingerprint \(.Fingerprint)"' "$RUNNER_TEMP/leaks.json"
          fi
          exit "$status"

      # tsconfig/jsconfig and .vscode files allow comments, so they are not plain JSON.
      - name: JSON files are valid
        run: |
          status=0
          while IFS= read -r f; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; status=1; }
          done < <(git ls-files '*.json' | grep -Ev '(^|/)(ts|js)config[^/]*\.json$|^\.vscode/')
          exit $status

      - name: Links between Markdown files resolve
        shell: python3 {0}
        run: |
          import re, subprocess, sys
          from pathlib import Path

          link = re.compile(r"\]\((<[^>]+>|[^)\s]+)")
          broken = 0
          files = subprocess.run(["git", "ls-files", "*.md"], capture_output=True, text=True, check=True).stdout.splitlines()
          for name in files:
              path = Path(name)
              in_code = False
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.lstrip().startswith("```"):
                      in_code = not in_code
                      continue
                  if in_code:
                      continue
                  for target in link.findall(line):
                      if re.match(r"^[a-z][a-z0-9+.-]*:", target, re.I) or target.startswith("#"):
                          continue
                      target = target.strip("<>").split("#")[0].replace("%20", " ")
                      base = Path(".") if target.startswith("/") else path.parent
                      if not (base / target.lstrip("/")).exists():
                          print(f"::error file={name},line={number}::broken link: {target}")
                          broken += 1
          sys.exit(1 if broken else 0)

      # Example product: remove these two steps along with examples/ (README, "Make it yours").
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Example product tests
        working-directory: examples/habit-streaks
        run: npm test

      # Add your product's checks below once it has code. For Node.js, for example:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: 22
      # - run: npm ci     # needs a committed package-lock.json; skip it with no dependencies
      # - run: npm test
